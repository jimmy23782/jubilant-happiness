name: CI (Build & Test)

on:
  push:
    branches: ["feature/**", "feat/**"]   # Adjust branches as needed
  pull_request:
    branches: ["**"]
permissions:
  contents: read
  id-token: write   # required for OIDC → AWS

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: students-demo
  IMAGE_PLATFORMS: linux/amd64

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & run unit tests
        run: ./gradlew clean test --no-daemon

      # Optional: upload HTML report so you can download it from Actions UI
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      # --- AWS auth via OIDC (no long-lived keys) ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo exists (idempotent)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null
          echo "ECR repo ensured: $ECR_REPO"

      - name: Derive image tags
        id: meta
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          REPO="${{ env.ECR_REPO }}"
          BRANCH="${GITHUB_REF_NAME//\//-}"  # feature/my-branch -> feature-my-branch
          SHA="${GITHUB_SHA::7}"
          echo "image=${REG}/${REPO}" >> $GITHUB_OUTPUT
          echo "tag_branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tag_sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.IMAGE_PLATFORMS }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_branch }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output pushed image tags
        run: |
          echo "Pushed:"
          echo " - ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_branch }}"
          echo " - ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}"